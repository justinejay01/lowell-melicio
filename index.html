<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGI-MOD - Digital Module</title>
    <link rel="stylesheet" href="css/plyr.css" />
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css" type="text/css">

    <style>
        #mainNav {
            background: transparent;
            transition: 250ms ease-in-out;
            /* Add smooth transition */
        }

        #mainNav.scrolled {
            background: rgb(76, 175, 80, 1);
            /* Optional: add a subtle shadow */
        }

        /* Change link color and text color for the scrolled state */
        #mainNav.scrolled .navbar-nav .nav-link,
        #mainNav.scrolled .navbar-brand {
            color: #ffffff !important;
            /* Force text color to dark when scrolled */
        }

        #mainNav.scrolled .navbar-nav .nav-link.active,
        #mainNav.scrolled .navbar-nav .nav-link:hover {
            background: rgb(0, 0, 0, 0.2);
        }

        /* Hide the dropdown arrow */
        .navbar .nav-item .dropdown-toggle::after {
            display: none;
        }
    </style>
</head>

<body class="hero-section" data-bs-spy="scroll" data-bs-target=".navbar" data-bs-offset="50">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="leaf-logo.png" alt="Logo" width="30" class="me-2">
                <div>
                    <div style="font-size: 1.1rem;">GRADE 10</div>
                    <div style="font-size: 0.9rem; font-weight: normal;">SCIENCE</div>
                </div>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                style="border: none; color: white;">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">HOME</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            ABOUT
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="unit-vi.html">UNIT VI: COORDINATED FUNCTIONS OF THE REPRODUCTIVE, ENDOCRINE, AND NERVOUS</a></li>
                            <li><a class="dropdown-item" href="unit-vii.html">Unit VII: INHERITANCE AND VARIATION</a></li>
                            <li><a class="dropdown-item" href="unit-viii.html">UNIT VIII: BIODIVERSITY AND EVOLUTION</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#more">MORE</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div id="home" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <!-- Hero Content -->
        <div class="hero-content">
            <div class="container">
                <h1 class="hero-title">
                    <strong>DIGI-MOD</strong><br>
                    <strong>(Digital Module)</strong>
                </h1>
            </div>
        </div>
    </div>

    <script src="js/scripts.js"></script>
    <script src="js/plyr.polyfilled.js"></script>
    <!-- <script src="js/main.js"></script> -->
    <script>
        window.addEventListener('scroll', function () {
            const navbar = document.querySelector('#mainNav');
            const scrolled = window.scrollY > 80; // Change to your desired scroll trigger point

            if (scrolled) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Tab functionality
        document.querySelectorAll('.sub-nav .nav-link').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                // Remove active class from all links
                document.querySelectorAll('.sub-nav .nav-link').forEach(l => l.classList.remove('active'));

                // Add active class to clicked link
                this.classList.add('active');

                // Update content based on section
                // const section = this.getAttribute('data-section');
                // updateContent(section);
            });
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/js/service-worker.js')
                .then(function (registration) {
                    console.log('Service Worker registered with scope:', registration.scope);
                }).catch(function (error) {
                    console.error('Service Worker registration failed:', error);
                });
        }
    </script>
</body>

</html>
